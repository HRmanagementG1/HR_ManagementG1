<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared HR dashboard example</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Change these two paths if your page is outside the Shared folder. -->
  <link rel="stylesheet" href="hr_dashboard.css" />
  <script defer src="hr_dashboard.js"></script>
</head>
<body style="margin: 0; background: #fafaf8; font-family: 'Inter', sans-serif;">
  <!-- Choose the highlighted page: policies or leave. -->
  <div data-hr-dashboard-sidebar data-active-page="policies"></div>

  <div class="hr-dashboard-content">
    <div data-hr-dashboard-topbar
         data-search-placeholder="Search this example…"
         data-search-label="Search example"></div>

    <!-- Replace this main area with your own page content. -->
    <main style="padding: 32px;">
      <h1>Your page title</h1>
      <p>The sidebar and user bar are loaded from the shared files.</p>
      <p id="search-result" aria-live="polite">Try typing in the search bar.</p>
    </main>
  </div>

  <!-- In a real page, put this code in your own page script. -->
  <script>
    async function setupPageSearch() {
      try {
        await window.hrDashboardReady;
        const search = document.getElementById('global-search');
        const result = document.getElementById('search-result');

        search.addEventListener('input', () => {
          result.textContent = search.value
            ? `You searched for: ${search.value}`
            : 'Try typing in the search bar.';
        });
      } catch (error) {
        console.error('Could not set up page search.', error);
      }
    }

    // Wait for the deferred shared script to run first.
    document.addEventListener('DOMContentLoaded', setupPageSearch);
  </script>
</body>
</html>
