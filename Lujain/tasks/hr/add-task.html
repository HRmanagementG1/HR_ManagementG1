
<!doctype html>
<html lang="en">

<head>
    <!-- إعداد الصفحة وربط ملفات التنسيق -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Add Task | Workforce</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../shared/components.css">
    <link rel="stylesheet" href="hr.css">
    <link rel="stylesheet" href="add-task.css">
</head>

<body>

    <div class="hr-shell">

       <aside class="sidebar">

            <div class="brand">
                ● Workforce
            </div>

            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="add-task.html">Add Task</a>
                <a href="all-tasks.html" class="active">All Tasks</a>
                <a href="employee-tracking.html">Employee Tracking</a>
                <a href="submission-review.html">Submission Review</a>
            </nav>

        </aside>
        <main class="hr-main">

            <div class="topbar">

                <div>
                    <h1>Create a task</h1>
                    <p class="muted">Assign work and set a due date.</p>
                </div>

            </div>

            <form id="taskForm" class="form-wrap">

                <label>Task title</label>
                <input name="title" required>

                <label>Employee</label>
                <select name="employeeId" id="employeeSelect"></select>

                <label>Description</label>
                <textarea name="description" rows="4" required></textarea>

                <div class="row">

                    <div class="col">

                        <label>Priority</label>

                        <select name="priority">
                            <option>Normal</option>
                            <option>High</option>
                            <option>Low</option>
                        </select>

                    </div>

                    <div class="col">

                        <label>Due date</label>
                        <input type="date" name="dueDate" required>

                    </div>

                </div>

                <div class="actions">

                    <button class="btn-teal">
                        Create task
                    </button>

                    <a class="btn btn-light" href="all-tasks.html">
                        Cancel
                    </a>

                </div>

            </form>

        </main>

    </div>

    <script src="../shared/data.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="hr.js"></script>
    <script src="add-task.js"></script>

</body>

</html>
