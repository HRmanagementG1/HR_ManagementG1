<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Add Employee | Workforce</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../../Shared/hr_dashboard.css" />
    <link rel="stylesheet" href="addemployee.css" />
    <script defer src="../../../Shared/hr_dashboard.js"></script>
    <link rel="stylesheet" href="../../../Shared/theme.css" />
    <script defer src="../../../Shared/access.js"></script>
    <script src="../../../Shared/site-shell.js" defer></script>
  </head>
  <body class="hr-workspace-page" data-workspace-role="HR">
    <div data-hr-dashboard-sidebar data-active-page="employees"></div>
    <div class="hr-dashboard-content">
      <div
        data-hr-dashboard-topbar
        data-search-target=".main-search input"
        data-search-placeholder="Search employees…"
      ></div>
      <main class="record-form">
        <p class="workspace-eyebrow">PEOPLE OPERATIONS / ONBOARDING</p>
        <h1>Add New Employee</h1>
        <p>Give your new teammate a complete record and a place to start.</p>
        <div id="alertMessage" class="alert d-none" role="alert"></div>
        <form id="addEmployeeForm">
          <div class="record-fields">
            <div>
              <label for="empName">Full name</label
              ><input id="empName" type="text" required />
            </div>
            <div>
              <label for="empEmail">Official email</label
              ><input id="empEmail" type="email" required />
            </div>
            <div>
              <label for="empPosition">Job title</label
              ><input id="empPosition" type="text" required />
            </div>
            <div>
              <label for="empPhone">Phone number</label
              ><input id="empPhone" type="tel" />
            </div>
            <div>
              <label for="empLocation">Location / office</label
              ><input id="empLocation" type="text" required />
            </div>
            <div>
              <label for="empHireDate">Hire date</label
              ><input id="empHireDate" type="date" required />
            </div>
            <div>
              <label for="empSalary">Annual base salary (USD)</label
              ><input
                id="empSalary"
                type="number"
                min="0"
                step="0.01"
                required
              />
            </div>
            <div>
              <label for="empPassword">Temporary password</label
              ><input
                id="empPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              />
            </div>
            <div>
              <label for="empDepartment">Department</label
              ><select id="empDepartment">
                <option>Engineering</option>
                <option>IT</option>
                <option>Design</option>
                <option>Product & Design</option>
                <option>Marketing</option>
                <option>Human Resources</option>
                <option>Operations</option>
                <option>Finance</option>
                <option>Sales</option>
              </select>
            </div>
            <div>
              <label for="empEmploymentType">Employment type</label
              ><select id="empEmploymentType">
                <option>Full-time</option>
                <option>Part-time</option>
                <option>Contract</option>
                <option>Internship</option>
              </select>
            </div>
            <div>
              <label for="empRole">Account role</label
              ><select id="empRole">
                <option>Employee</option>
                <option>HR</option>
              </select>
            </div>
            <div>
              <label for="empManager">Direct manager</label
              ><select id="empManager">
                <option value="">Not assigned</option>
              </select>
            </div>
            <div class="wide">
              <label for="empBio">About / employee notes</label
              ><textarea id="empBio" rows="3"></textarea>
            </div>
          </div>
          <p>
            Share the employee's email and temporary password so they can sign
            in.
          </p>
          <div class="record-actions">
            <button type="submit">Save Employee Data</button
            ><a href="../allemployeehr/allemployeehr.html"
              >Back to Employees List</a
            >
          </div>
        </form>
      </main>
    </div>
    <script src="../../../Shared/workspace.js"></script>
    <script src="addemployee.js"></script>
  </body>
</html>
