<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Employee Login | Wanderly</title>
    <link rel="stylesheet" href="../../Shared/auth.css" />
    <link rel="stylesheet" href="../../Shared/theme.css" />
    <script src="../../Shared/site-shell.js" defer></script>
  </head>
  <body>
    <header class="auth-top">
      <a href="../../index.html" class="auth-brand"
        ><img
          class="workforce-logo"
          src="../../Images/wanderly-logo.png"
          alt="Wanderly" /></a
      ><a href="../../index.html">← Back to home</a>
    </header>
    <main class="auth-layout">
      <section class="auth-visual">
        <img src="../../Images/hero.jpg" alt="A welcoming workplace" />
        <div class="auth-copy">
          <h1>Your next great workday starts here.</h1>
          <p>People, work, and everything that brings them together.</p>
        </div>
      </section>
      <section class="auth-panel">
        <div>
          <p class="auth-eyebrow">Employee workspace</p>
          <h2>Welcome back.</h2>
          <p class="auth-intro">
            Your tasks, your people, and the details that matter.
          </p>
          <form id="loginForm">
            <label for="username">Email or username</label
            ><input
              id="username"
              autocomplete="username"
              required
              placeholder="you@workforce.example"
            /><label for="password">Password</label>
            <div class="auth-password">
              <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Enter your password"
              /><button id="togglePassword" type="button" aria-pressed="false">
                Show
              </button>
            </div>
            <p id="login-message" role="alert" hidden></p>
            <button class="auth-submit" type="submit">
              Sign in to your workspace →
            </button>
          </form>
          <p class="auth-switch">
            Part of the HR team? <a href="../loginHr/LoginHr.html">HR login</a>
          </p>
        </div>
      </section>
    </main>
    <script src="../../Shared/login.js"></script>
    <script src="LoginEmp.js"></script>
  </body>
</html>
