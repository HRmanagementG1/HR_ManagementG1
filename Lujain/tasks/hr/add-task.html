
<!doctype html>
<html lang="en">

<head>
    <!-- إعداد الصفحة وربط ملفات التنسيق -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../shared/components.css">
    <link rel="stylesheet" href="hr.css">
    <link rel="stylesheet" href="add-task.css">
</head>

<body>

    <div class="hr-shell">

        <aside class="sidebar">

    <!-- Logo -->
    <div class="sidebar-header">
        <div class="logo-icon">W</div>

        <div class="logo-text">
            <h2>Workforce</h2>
            <span>PEOPLE • WORK.</span>
            <small>GROW TOGETHER</small>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">

        <a href="dashboard.html" class="nav-item">
            <span class="nav-icon">▦</span>
            <span>Dashboard</span>
        </a>

        <a href="employees.html" class="nav-item">
            <span class="nav-icon">♙</span>
            <span>All Employees</span>
        </a>

        <a href="leave-requests.html" class="nav-item">
            <span class="nav-icon">▤</span>
            <span>Leave Requests</span>
        </a>

        <a href="tasks.html" class="nav-item active">
            <span class="nav-icon">☑</span>
            <span>Tasks</span>
        </a>

        <a href="policies.html" class="nav-item">
            <span class="nav-icon">▣</span>
            <span>Policies</span>
        </a>

        <a href="zoom-meetings.html" class="nav-item">
            <span class="nav-icon">▧</span>
            <span>Zoom Meetings</span>
        </a>

        <a href="feedback.html" class="nav-item">
            <span class="nav-icon">▱</span>
            <span>Feedback</span>
        </a>

    </nav>

    <!-- Logout -->
    <div class="sidebar-footer">
        <a href="login.html" class="logout">
            <span class="logout-icon">⇥</span>
            <span>Logout</span>
        </a>
    </div>

</aside>

        <main class="hr-main">

            <div class="topbar">

                <div>
                    <h1>Create a task</h1>
                    <p class="muted">Assign work and set a due date.</p>
                </div>

            </div>

            <form id="taskForm" class="form-wrap">

                <label>Task title</label>
                <input name="title" required>

                <label>Employee</label>
                <select name="employeeId" id="employeeSelect"></select>

                <label>Description</label>
                <textarea name="description" rows="4" required></textarea>

                <div class="row">

                    <div class="col">

                        <label>Priority</label>

                        <select name="priority">
                            <option>Normal</option>
                            <option>High</option>
                            <option>Low</option>
                        </select>

                    </div>

                    <div class="col">

                        <label>Due date</label>
                        <input type="date" name="dueDate" required>

                    </div>

                </div>

                <div class="actions">

                    <button class="btn-teal">
                        Create task
                    </button>

                    <a class="btn btn-light" href="all-tasks.html">
                        Cancel
                    </a>

                </div>

            </form>

        </main>

    </div>

    <script src="../shared/data.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="hr.js"></script>
    <script src="add-task.js"></script>

</body>

</html>
