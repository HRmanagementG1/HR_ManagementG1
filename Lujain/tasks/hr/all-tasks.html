
<!doctype html>
<html lang="en">

<head>
    <!-- إعداد الصفحة وربط ملفات التنسيق -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>All Tasks | Workforce</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../shared/components.css">
    <link rel="stylesheet" href="hr.css">
    <link rel="stylesheet" href="all-tasks.css">
</head>

<body>

    <div class="hr-shell">

        <aside class="sidebar">

            <div class="brand">
                ● Workforce
            </div>

            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="add-task.html">Add Task</a>
                <a href="all-tasks.html" class="active">All Tasks</a>
                <a href="employee-tracking.html">Employee Tracking</a>
                <a href="submission-review.html">Submission Review</a>
            </nav>

        </aside>

        <main class="hr-main">

            <div class="topbar">

                <div>
                    <h1>All tasks</h1>
                    <p class="muted">Browse and filter employee tasks.</p>
                </div>

                <a class="btn-teal" href="add-task.html">
                    + Add task
                </a>

            </div>

            <input
                id="searchTasks"
                placeholder="Search by task or employee"
            >

            <div class="table-wrap mt-3">

                <table>

                    <thead>
                        <tr>
                            <th>Task</th>
                            <th>Employee</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Due date</th>
                            <th></th>
                        </tr>
                    </thead>

                    <tbody id="allTasksBody"></tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="../shared/data.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="hr.js"></script>
    <script src="all-tasks.js"></script>

</body>

</html>
