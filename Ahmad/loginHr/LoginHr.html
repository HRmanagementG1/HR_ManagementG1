<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HR Login | Wanderly</title>
    <link rel="stylesheet" href="../../Shared/auth.css" />
    <link rel="stylesheet" href="../../Shared/theme.css" />
    <script src="../../Shared/site-shell.js" defer></script>
  </head>
  <body>
    <header class="auth-top">
      <a href="../../index.html" class="auth-brand"
        ><img
          class="workforce-logo"
          src="../../Images/wanderly-logo.png"
          alt="Wanderly" /></a
      ><a href="../../index.html">← Back to home</a>
    </header>
    <main class="auth-layout">
      <section class="auth-visual">
        <img src="../../Images/hero.jpg" alt="A welcoming workplace" />
        <div class="auth-copy">
          <h1>Your next great workday starts here.</h1>
          <p>People, work, and everything that brings them together.</p>
        </div>
      </section>
      <section class="auth-panel">
        <div>
          <p class="auth-eyebrow">HR workspace</p>
          <h2>Welcome back.</h2>
          <p class="auth-intro">
            Support your people and keep your team moving forward.
          </p>
          <form id="loginForm">
            <label for="workEmail">Email or username</label
            ><input
              id="workEmail"
              autocomplete="username"
              required
              placeholder="you@workforce.example"
            /><label for="password">Password</label>
            <div class="auth-password">
              <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Enter your password"
              /><button id="togglePassword" type="button" aria-pressed="false">
                Show
              </button>
            </div>
            <p id="login-message" role="alert" hidden></p>
            <button class="auth-submit" type="submit">Sign in to HR →</button>
          </form>
          <p class="auth-switch">
            Looking for your employee workspace?
            <a href="../LoginEmp/LoginEmp.html">Employee login</a>
          </p>
        </div>
      </section>
    </main>
    <script src="LoginHr.js"></script>
  </body>
</html>
