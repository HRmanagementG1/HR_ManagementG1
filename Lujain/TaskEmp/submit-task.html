
<!doctype html>
<html lang="en">

<head>
    <!-- إعداد الصفحة وربط ملفات التنسيق -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Submit Task | Wanderly</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../shared/components.css">
    <link rel="stylesheet" href="employee.css">
    <link rel="stylesheet" href="submit-task.css">
<link rel="stylesheet" href="../../Shared/employee_header.css"><script defer src="../../Shared/employee_header.js"></script><link rel="stylesheet" href="../../Shared/theme.css"><script defer src="../../Shared/access.js"></script><script defer src="../../Shared/attachments.js"></script><script src="../../Shared/site-shell.js" defer></script></head>

<body data-workspace-role="Employee"><div data-employee-header data-active-page="tasks"></div><nav class="emp-main"><a href="my-tasks.html">My Tasks</a> · <a href="revision-required.html">Revisions</a></nav>


    <main class="emp-main">

        <section class="hero">

            <h1>Submit your task</h1>

            <p>Share your completed work with HR.</p>

        </section>

        <form id="submitForm" class="emp-form">

            <div id="submitTaskTitle"></div>

            <label for="submissionLink">Work link or reference (optional if uploading a file)</label>

            <input
                name="submission"
                id="submissionLink"
                placeholder="Paste a link to your work"
            >

            <div class="task-upload"><label for="taskAttachments">Upload your files</label><input type="file" id="taskAttachments" name="attachments" multiple><small>Documents, images, or archives · up to 20 MB per file</small></div>
            <div id="existingAttachments" class="attachment-list"></div>
            <p id="submissionMessage" class="task-message" role="alert" hidden></p>
            <label for="submissionComment">Comment</label>

            <textarea id="submissionComment" name="comment" rows="4"></textarea>

            <button type="submit" class="btn-teal mt-3">
                Submit task
            </button>

        </form>

    </main>



    <script src="../../Shared/workspace.js"></script><script src="employee.js"></script>
    <script src="submit-task.js"></script>

</body>

</html>
