
<!doctype html>
<html lang="en">

<head>
    <!-- إعداد الصفحة وربط ملفات التنسيق -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Tasks | Wanderly</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../shared/components.css">
    <link rel="stylesheet" href="employee.css">
    <link rel="stylesheet" href="my-tasks.css">
<link rel="stylesheet" href="../../Shared/employee_header.css"><script defer src="../../Shared/employee_header.js"></script><link rel="stylesheet" href="../../Shared/theme.css"><script defer src="../../Shared/access.js"></script><script defer src="../../Shared/attachments.js"></script><script src="../../Shared/site-shell.js" defer></script></head>

<body data-page="my-tasks" data-workspace-role="Employee"><div data-employee-header data-active-page="tasks"></div>



    <main class="emp-main">

        <section class="hero">

            <p class="task-breadcrumb">Home / Tasks</p><h1>Good work, together.</h1>

            <p>A clear view of what needs to happen, who owns it, and what comes next.</p><span class="assigned-badge"><span></span> Assigned tasks for <strong id="taskEmployeeName"></strong></span>

        </section>

        <div class="task-columns">

            <section class="task-column">

                <div class="column-heading"><b>To do</b><span id="todoCount">0</span></div>

                <div id="todoColumn"></div>

            </section>

            <section class="task-column">

                <div class="column-heading"><b>In progress</b><span id="progressCount">0</span></div>

                <div id="progressColumn"></div>

            </section>

            <section class="task-column">

                <div class="column-heading"><b>Done</b><span id="doneCount">0</span></div>

                <div id="doneColumn"></div>

            </section>

        </div>

    </main>



    <script src="../../Shared/workspace.js"></script><script src="employee.js"></script>
    <script src="my-tasks.js"></script>

</body>

</html>
