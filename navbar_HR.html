<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navbar_HR</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/navbar_Employee.css">
</head>
<body>

  <header class="navbar" id="navbar">

    <div class="nav-inner">
      <a href="#" class="logo">
        <img src="assets/logo.png" alt="Workforce">
      </a>
      <button class="burger" onclick="
        const nav = document.getElementById('navbar');
        nav.classList.toggle('open');
        this.textContent = nav.classList.contains('open') ? '✕' : '☰';
      ">☰</button>
         
      <ul class="nav-links">
        <li><a href="#/home" class="active">Home</a></li>
        <li><a href="#/services">Services</a></li>
        <li><a href="#/workflow">Workflow</a></li>
        <li><a href="#/about">About</a></li>
        <li><a href="#/contact">Contact</a></li>
        <li><a href="#/profile">My profile</a></li>
        <li><a href="#/hr">HR desk</a></li>
      </ul>

      <div class="nav-actions">
        <a href="#" class="btn">Log out</a>
        <a href="#/profile" class="user">
          <span class="user-avatar">L</span>
          <span class="user-name">Lina</span>
        </a>
      </div>

      
    </div>
  </header>

</body>
</html>
